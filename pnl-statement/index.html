<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>P&amp;L Statement — Sigma Plugin</title>
<script>
  /* wiretap: record plugin<->Sigma messages so the waiting state can show them */
  window.__wire = [];
  (function(){
    var t0 = Date.now();
    function note(dir, d){ try { window.__wire.push(((Date.now()-t0)/1000).toFixed(1) + 's ' + dir + ' ' + (d && d.type) +
      (d && d.args ? ' ' + JSON.stringify(d.args).slice(0, 90) : '') + (d && d.error ? ' ERR ' + JSON.stringify(d.error).slice(0, 120) : '') +
      (d && d.result !== undefined ? ' -> ' + JSON.stringify(d.result).slice(0, 90) : '')); } catch (e) {} }
    window.addEventListener('message', function(e){ note('<', e.data); }, true);
    try { var pm = window.parent.postMessage.bind(window.parent);
      window.parent.postMessage = function(d, o){ note('>', d); return pm(d, o); }; } catch (e) { window.__wire.push('cannot wrap parent.postMessage: ' + e.message); }
    window.addEventListener('error', function(e){ window.__wire.push('JS ERROR ' + e.message); });
  })();
</script>
<!-- SDK UMD needs window.React at load (createContext) and exports window.SigmaPlugin. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/@sigmacomputing/plugin@1.3.2/dist/umd/sigmacomputing-plugin.umd.js"></script>
<style>
  :root{
    --navy:#1A1C3A; --primary:#4F529B; --accent:#F58132; --mint:#2E9E7B;
    --text:#111827; --muted:#6b7280; --rule:#d1d5db; --rule-soft:#e5e7eb;
    --band:#f3f4f6; --total:#f0fdf4; --neg:#9f1239; --pos:#047857;
    --paper:#ffffff; --sel:#EEF2FF;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
    background:transparent;color:var(--text);overflow:hidden;
  }
  #app{height:100%;width:100%;display:flex;flex-direction:column;padding:8px 10px 6px}
  #mast{
    display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:end;
    padding:0 2px 10px;border-bottom:2px solid var(--navy);margin-bottom:0;
  }
  #mast .entity{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--primary)}
  #mast .title{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--navy);line-height:1.15;margin-top:2px}
  #mast .period{font-size:12px;color:var(--muted);margin-top:3px}
  #mast .right{text-align:right;font-size:11px;color:var(--muted);line-height:1.45}
  #mast .right b{color:var(--text);font-weight:650}
  #stage{flex:1;min-height:0;overflow:auto;background:var(--paper)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{
    position:sticky;top:0;z-index:2;background:var(--paper);
    border-bottom:1px solid var(--navy);padding:10px 10px 8px;
    font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  }
  thead th.num, td.num{
    text-align:right;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
    font-family:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;font-size:12px;
  }
  thead th.line, td.line{text-align:left}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--rule-soft);vertical-align:middle}
  tr.section td{
    background:var(--band);font-weight:700;font-size:10.5px;letter-spacing:.05em;
    text-transform:uppercase;color:var(--navy);padding-top:10px;padding-bottom:10px;
    border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  }
  tr.detail td.line{padding-left:22px}
  tr.detail,tr.total,tr.subtotal{cursor:pointer}
  tr.detail:hover td,tr.total:hover td,tr.subtotal:hover td{background:#f8fafc}
  tr.detail.selected td,tr.total.selected td,tr.subtotal.selected td{background:var(--sel)}
  tr.subtotal td{font-weight:650;border-top:1px solid var(--rule);background:#fafafa}
  tr.subtotal td.num{border-top:1px solid var(--text)}
  tr.total td{
    background:var(--total);font-weight:750;border-top:2px solid var(--navy);
    border-bottom:3px double var(--navy);padding-top:10px;padding-bottom:10px;
  }
  tr.total td.line{color:var(--navy)}
  .neg{color:var(--neg)}
  .pos{color:var(--pos)}
  .muted{color:var(--muted)}
  .spacer td{padding:4px 0;border:0;background:transparent}
  #empty{
    height:100%;min-height:180px;display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-size:13px;text-align:center;padding:24px;line-height:1.55;
  }
  #foot{
    font-size:10px;color:var(--muted);margin-top:6px;padding-top:6px;
    border-top:1px solid var(--rule-soft);
    display:flex;justify-content:space-between;gap:8px;
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
</head>
<body>
<div id="app">
  <div id="mast">
    <div>
      <div class="entity" id="entity">Practice</div>
      <div class="title" id="ttl">Consolidated Statement of Operations</div>
      <div class="period" id="sub">Prior TTM vs Current TTM · live filtered</div>
    </div>
    <div class="right" id="meta"></div>
  </div>
  <div id="stage"></div>
  <div id="foot"><span id="foot-l"></span><span id="foot-r">Click a line to cross-filter</span></div>
</div>
<script>
(function () {
  /* pnl-stmt v6 — SDK 1.x UMD exports window.SigmaPlugin */
  var client = (window.SigmaPlugin && window.SigmaPlugin.client)
    || (window.sigma && window.sigma.plugin && window.sigma.plugin.client)
    || (window.sigmaComputing && window.sigmaComputing.plugin && window.sigmaComputing.plugin.client)
    || null;
  if (!client) console.error('[pnl-stmt] Sigma plugin SDK not loaded');

  var defs = [
    { name: 'source', type: 'element' },
    { name: 'line', type: 'column', source: 'source', allowMultiple: false, label: 'Line / account' },
    { name: 'prior', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number','integer'], label: 'Prior period' },
    { name: 'current', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number','integer'], label: 'Current period' },
    { name: 'order', type: 'column', source: 'source', allowMultiple: false, allowedTypes: ['number','integer'], label: 'Sort order (optional)' },
    { name: 'section', type: 'column', source: 'source', allowMultiple: false, label: 'Section (optional)' },
    { name: 'rowKind', type: 'column', source: 'source', allowMultiple: false, label: 'Row kind (optional)' },
    { name: 'lineVar', type: 'variable', label: 'Click line → control variable',
      description: 'Bind a List control (e.g. PnlLineFilter). Clicking a detail line writes the account name for cross-filtering.' },
    { name: 'onLineSelect', type: 'action-trigger', label: 'On line select action' },
    { name: 'title', type: 'text', label: 'Statement title', defaultValue: 'Consolidated Statement of Operations' },
    { name: 'subtitle', type: 'text', label: 'Period label', defaultValue: 'Prior TTM vs Current TTM · live filtered' },
    { name: 'entity', type: 'text', label: 'Entity / practice', defaultValue: 'Practice' },
    { name: 'priorLabel', type: 'text', label: 'Prior column header', defaultValue: 'Prior TTM' },
    { name: 'currentLabel', type: 'text', label: 'Current column header', defaultValue: 'Current TTM' },
    { name: 'navy', type: 'text', label: 'Navy hex', defaultValue: '#1A1C3A' },
    { name: 'primary', type: 'text', label: 'Primary hex', defaultValue: '#4F529B' },
    { name: 'accent', type: 'text', label: 'Accent hex', defaultValue: '#F58132' },
    { name: 'siCompact', type: 'toggle', label: 'SI compact currency ($109M)', defaultValue: true },
    { name: 'accountingNeg', type: 'toggle', label: 'Accounting negatives ($x)', defaultValue: true }
  ];
  if (client) client.config.configureEditorPanel(defs);

  var state = { cfg: {}, rows: [], live: false, selected: null, unsub: null, unsubCols: null, cols: {} };

  function isArr(x){ return Object.prototype.toString.call(x) === '[object Array]'; }
  function sourceId(src){
    if (!src) return null;
    if (typeof src === 'string') return src;
    if (typeof src === 'object') return src.elementId || src.id || src.nodeId || src.sourceId || null;
    return null;
  }
  function colKey(cfgVal){
    if (cfgVal == null || cfgVal === '') return null;
    if (typeof cfgVal === 'string' || typeof cfgVal === 'number') return String(cfgVal);
    if (isArr(cfgVal)) return colKey(cfgVal[0]);
    if (typeof cfgVal === 'object'){
      if (cfgVal.columnId != null) return String(cfgVal.columnId);
      if (cfgVal.id != null) return String(cfgVal.id);
    }
    return null;
  }
  function colMetaName(id){
    var m = state.cols && state.cols[id];
    return (m && (m.name || m.label)) || '';
  }
  function findCol(data, want, aliases){
    if (!data || !want) return null;
    if (data[want] && data[want].length) return want;
    var wantL = String(want).toLowerCase();
    var id, n, i, nm;
    for (id in (state.cols || {})){
      n = String((state.cols[id] && (state.cols[id].name || state.cols[id].label)) || '').toLowerCase();
      if (n === wantL && data[id] && data[id].length) return id;
    }
    for (id in data){
      if (!data[id] || !data[id].length) continue;
      nm = String(colMetaName(id) || id).toLowerCase();
      if (nm === wantL) return id;
    }
    if (aliases && aliases.length){
      for (id in data){
        if (!data[id] || !data[id].length) continue;
        nm = String(colMetaName(id) || id).toLowerCase();
        for (i = 0; i < aliases.length; i++){
          if (nm === aliases[i] || nm.indexOf(aliases[i]) >= 0) return id;
        }
      }
    }
    return null;
  }
  function asNum(v){
    if (v == null || v === '') return null;
    if (typeof v === 'number') return isFinite(v) ? v : null;
    var n = Number(String(v).replace(/[$,\s]/g,'').replace(/\((.*)\)/,'-$1'));
    return isFinite(n) ? n : null;
  }
  function fmtSI(v, accounting){
    if (v == null || isNaN(v)) return '—';
    var neg = v < 0, a = Math.abs(v), s;
    if (a >= 1e9) s = (a/1e9).toFixed(2).replace(/\.00$/,'') + 'B';
    else if (a >= 1e6) s = (a/1e6).toFixed(a >= 1e8 ? 1 : 2).replace(/\.00$/,'') + 'M';
    else if (a >= 1e3) s = (a/1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/,'') + 'K';
    else s = Math.round(a).toLocaleString('en-US');
    if (neg && accounting) return '($' + s + ')';
    return (neg ? '-$' : '$') + s;
  }
  function fmtFull(v, accounting){
    if (v == null || isNaN(v)) return '—';
    var neg = v < 0, a = Math.abs(v);
    var s = a.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    if (neg && accounting) return '($' + s + ')';
    return neg ? ('-$' + s) : ('$' + s);
  }
  function fmtPct(v){
    if (v == null || isNaN(v) || !isFinite(v)) return '—';
    var s = (Math.abs(v)*100).toFixed(1) + '%';
    return (v < 0 ? '(' : '') + s + (v < 0 ? ')' : '');
  }
  function classify(name, kindHint){
    var k = String(kindHint || '').toLowerCase();
    if (k === 'section' || k === 'total' || k === 'subtotal' || k === 'detail') return k;
    var n = String(name || '').toLowerCase().trim();
    if (!n) return 'detail';
    if (/^(revenue|revenues|income|expenses?|costs?|cogs|margins?|other)$/.test(n)) return 'section';
    if (/(^total |contribution|net (income|earnings|revenue|patient)|operating (income|profit|loss)|gross (profit|margin|contrib)|ebitda)/.test(n)) return 'total';
    if (/(gross after|after .*cost|subtotal|income from|income before)/.test(n)) return 'subtotal';
    return 'detail';
  }
  function applyTheme(cfg){
    var r = document.documentElement.style;
    if (cfg.navy) r.setProperty('--navy', cfg.navy);
    if (cfg.primary) r.setProperty('--primary', cfg.primary);
    if (cfg.accent) r.setProperty('--accent', cfg.accent);
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);
    });
  }

  function rowsFromData(data, cfg){
    if (!data) return null;
    var lk = findCol(data, colKey(cfg.line), ['line', 'account', 'p&l line']);
    var pk = findCol(data, colKey(cfg.prior), ['prior ttm', 'prior', 'prior period']);
    var ck = findCol(data, colKey(cfg.current), ['current ttm', 'current', 'current period']);
    var ok = findCol(data, colKey(cfg.order), ['line order', 'order', 'ord']);
    var sk = findCol(data, colKey(cfg.section), ['section']);
    var rk = findCol(data, colKey(cfg.rowKind), ['row kind', 'kind']);
    if (!lk || !pk || !ck) {
      console.warn('[pnl-stmt] unresolved columns', {
        want: { line: colKey(cfg.line), prior: colKey(cfg.prior), current: colKey(cfg.current) },
        keys: Object.keys(data || {}),
        names: Object.keys(state.cols || {}).map(function(id){ return id + '=' + colMetaName(id); })
      });
      return null;
    }
    var labels = data[lk] || [];
    var priors = data[pk] || [];
    var currents = data[ck] || [];
    var orders = ok ? (data[ok] || []) : null;
    var sections = sk ? (data[sk] || []) : null;
    var kinds = rk ? (data[rk] || []) : null;
    var n = Math.max(labels.length, priors.length, currents.length);
    // Aggregate Product×State grain → one row per statement line
    var byLine = {};
    var maxAbs = 0;
    for (var i = 0; i < n; i++){
      var line = labels[i];
      if (line == null || line === '') continue;
      var key = String(line);
      var prior = asNum(priors[i]);
      var curr = asNum(currents[i]);
      if (prior != null) maxAbs = Math.max(maxAbs, Math.abs(prior));
      if (curr != null) maxAbs = Math.max(maxAbs, Math.abs(curr));
      if (!byLine[key]){
        byLine[key] = {
          line: key,
          prior: 0, current: 0, priorN: 0, currN: 0,
          order: orders ? (asNum(orders[i]) == null ? i+1 : asNum(orders[i])) : i+1,
          section: sections && sections[i] != null ? String(sections[i]) : null,
          kind: kinds && kinds[i] != null ? String(kinds[i]) : null
        };
      }
      var agg = byLine[key];
      if (prior != null) { agg.prior += prior; agg.priorN++; }
      if (curr != null) { agg.current += curr; agg.currN++; }
      if (orders) {
        var ord = asNum(orders[i]);
        if (ord != null && ord < agg.order) agg.order = ord;
      }
    }
    // Source is already in dollars (tbl-pnl-live * 1e6) — never rescale.
    var scale = 1;
    var rows = Object.keys(byLine).map(function(k){
      var r = byLine[k];
      return {
        line: r.line,
        prior: r.priorN ? r.prior * scale : null,
        current: r.currN ? r.current * scale : null,
        order: r.order,
        section: r.section,
        kind: r.kind
      };
    });
    rows.sort(function(a,b){ return a.order - b.order; });
    return rows;
  }

  function previewRows(){
    return [
      { line: 'Revenue', prior: null, current: null, order: 1, section: 'Revenue', kind: 'section' },
      { line: 'Net patient revenue', prior: 101100000, current: 109000000, order: 2, section: 'Revenue', kind: 'detail' },
      { line: 'Ancillary / medspa fees', prior: 38200000, current: 40720000, order: 3, section: 'Revenue', kind: 'detail' },
      { line: 'Total revenue', prior: 139300000, current: 149720000, order: 4, section: 'Revenue', kind: 'total' },
      { line: 'Expenses', prior: null, current: null, order: 5, section: 'Expenses', kind: 'section' },
      { line: 'Clinical & supply cost', prior: -40100000, current: -42720000, order: 6, section: 'Expenses', kind: 'detail' },
      { line: 'Cancellations & revisions', prior: -590000, current: -680000, order: 7, section: 'Expenses', kind: 'detail' },
      { line: 'Practice overhead', prior: -27400000, current: -29077000, order: 8, section: 'Expenses', kind: 'detail' },
      { line: 'Gross after clinical cost', prior: 61000000, current: 66280000, order: 9, section: 'Margins', kind: 'subtotal' },
      { line: 'Practice contribution', prior: 71210000, current: 77533000, order: 10, section: 'Margins', kind: 'total' }
    ];
  }

  function selectLine(line){
    state.selected = line;
    // RAW config value, exactly as the SDK's useVariable(config.lineVar) does.
    var bound = state.cfg && state.cfg.lineVar;
    if (!client || !bound) { render(state.rows, state.cfg, state.live); return; }
    try {
      if (!line) client.config.setVariable(bound);
      else client.config.setVariable(bound, String(line));
      if (state.cfg.onLineSelect) client.config.triggerAction(state.cfg.onLineSelect);
    } catch (e) { console.error('[pnl-stmt] setVariable failed', e); }
    render(state.rows, state.cfg, state.live);
  }

  function render(rows, cfg, live){
    cfg = cfg || {};
    state.rows = rows || [];
    state.live = !!live;
    applyTheme(cfg);
    document.getElementById('entity').textContent = cfg.entity || 'Practice';
    document.getElementById('ttl').textContent = cfg.title || 'Consolidated Statement of Operations';
    document.getElementById('sub').textContent = cfg.subtitle || 'Prior TTM vs Current TTM · live filtered';
    document.getElementById('meta').innerHTML = live
      ? ('<b>' + rows.length + '</b> line items<br/>Live · filter-aware')
      : ('<b>PREVIEW</b><br/>' + rows.length + ' sample lines');
    document.getElementById('foot-l').textContent = live
      ? 'Bound to workbook source · updates when filters change'
      : 'Map Line · Prior · Current in the editor panel';
    document.getElementById('foot-r').textContent = cfg.lineVar
      ? 'Click a line to cross-filter'
      : ((cfg.siCompact !== false) ? 'USD · SI compact' : 'USD');

    var stage = document.getElementById('stage');
    if (!rows || !rows.length){
      stage.innerHTML = '<div id="empty">Select a source table and map<br/><b>Line</b>, <b>Prior</b>, and <b>Current</b> columns.</div>';
      return;
    }

    var si = cfg.siCompact !== false;
    var accounting = cfg.accountingNeg !== false;
    var money = function(v){ return (si ? fmtSI : fmtFull)(v, accounting); };
    var priorH = cfg.priorLabel || 'Prior TTM';
    var currH = cfg.currentLabel || 'Current TTM';

    var html = ['<table><thead><tr>',
      '<th class="line">Account</th>',
      '<th class="num">' + escapeHtml(priorH) + '</th>',
      '<th class="num">' + escapeHtml(currH) + '</th>',
      '<th class="num">Variance</th>',
      '<th class="num">Var %</th>',
      '</tr></thead><tbody>'];

    var lastSection = null;
    rows.forEach(function(r){
      var kind = classify(r.line, r.kind);
      if (r.section && r.section !== lastSection && kind !== 'section'){
        if (lastSection != null) html.push('<tr class="spacer"><td colspan="5"></td></tr>');
        html.push('<tr class="section"><td class="line" colspan="5">' + escapeHtml(r.section) + '</td></tr>');
        lastSection = r.section;
      }
      if (kind === 'section'){
        if (lastSection != null) html.push('<tr class="spacer"><td colspan="5"></td></tr>');
        html.push('<tr class="section"><td class="line" colspan="5">' + escapeHtml(r.line) + '</td></tr>');
        lastSection = r.line;
        return;
      }
      lastSection = r.section || lastSection;
      var hasVals = r.prior != null || r.current != null;
      if (!hasVals) return;
      var delta = (r.current != null && r.prior != null) ? (r.current - r.prior) : null;
      var pct = (delta != null && r.prior) ? (delta / Math.abs(r.prior)) : null;
      var cls = kind === 'detail' ? 'detail' : kind;
      if (state.selected === r.line) cls += ' selected';
      var dCls = delta == null ? 'muted' : (delta < 0 ? 'neg' : (delta > 0 ? 'pos' : 'muted'));
      var pCls = pct == null ? 'muted' : (pct < 0 ? 'neg' : (pct > 0 ? 'pos' : 'muted'));
      html.push('<tr class="' + cls + '" data-line="' + escapeHtml(r.line) + '">');
      html.push('<td class="line">' + escapeHtml(r.line) + '</td>');
      html.push('<td class="num">' + (r.prior == null ? '—' : money(r.prior)) + '</td>');
      html.push('<td class="num">' + (r.current == null ? '—' : money(r.current)) + '</td>');
      html.push('<td class="num ' + dCls + '">' + (delta == null ? '—' : money(delta)) + '</td>');
      html.push('<td class="num ' + pCls + '">' + (pct == null ? '—' : fmtPct(pct)) + '</td>');
      html.push('</tr>');
    });
    html.push('</tbody></table>');
    stage.innerHTML = html.join('');
    stage.querySelectorAll('tr[data-line]').forEach(function(tr){
      tr.addEventListener('click', function(){
        var line = tr.getAttribute('data-line');
        selectLine(state.selected === line ? null : line);
      });
    });
  }

  var T0 = Date.now();
  function paintWire(){
    var w = document.getElementById('wire'); if (!w) return;
    if (Date.now() - T0 < 10000) { w.textContent = ''; return; }  // diagnostics only if stuck
    w.textContent = 'cfg: ' + (function(){ try { return JSON.stringify(state.cfg).slice(0, 400); } catch (e) { return '?'; } })() +
      '\n' + (window.__wire || []).slice(-40).join('\n');
  }
  setInterval(paintWire, 500);
  function showWaiting(cfg, msg){
    applyTheme(cfg || {});
    document.getElementById('entity').textContent = (cfg && cfg.entity) || 'Practice';
    document.getElementById('ttl').textContent = (cfg && cfg.title) || 'Consolidated Statement of Operations';
    document.getElementById('sub').textContent = (cfg && cfg.subtitle) || 'Prior TTM vs Current TTM · live filtered';
    document.getElementById('meta').innerHTML = '<b>LIVE</b><br/>waiting for source';
    document.getElementById('foot-l').textContent = msg || 'Waiting for workbook data…';
    var dg = state.diag || {};
    document.getElementById('foot-r').textContent = 'src=' + (dg.src || '—') + ' · feeds=' + (dg.feeds || 0) +
      ' keys=' + (dg.keys || 0) + ' cols=' + (dg.cols || 0);
    document.getElementById('stage').innerHTML =
      '<pre id="wire" style="font:10px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;color:#6b7280;padding:6px 12px;margin:0"></pre>' +
      '<div id="empty" style="height:auto;min-height:60px">' + (msg || 'Waiting for workbook source data…') + '</div>';
    paintWire();
    state.live = false;
    state.rows = [];
  }

  function ingest(data, cfg){
    var rows = rowsFromData(data || {}, cfg);
    if (!rows || !rows.length){
      // Bound source but empty/unresolved — NEVER silently show sample preview.
      showWaiting(cfg, 'Source bound but no rows yet (check column map / filters).');
      return;
    }
    render(rows, cfg, true);
  }

  function unwrapData(dd){
    if (dd && typeof dd === 'object' && dd.data && typeof dd.data === 'object' && !Array.isArray(dd.data) &&
        ('offset' in dd || 'isComplete' in dd)) return dd.data;
    return dd;
  }

  function bindKey(cfg){
    try { return JSON.stringify([cfg.source, cfg.line, cfg.prior, cfg.current, cfg.order, cfg.section, cfg.rowKind]); }
    catch (e) { return String(Math.random()); }
  }
  function bindSource(cfg){
    cfg = cfg || {};
    // Sigma re-delivers config right after init. Re-subscribing to the SAME
    // source drops the data feed (columns are re-sent, data is not), so keep a
    // live subscription whenever the binding is unchanged.
    var key = bindKey(cfg);
    if (state.unsub && key === state.bindKey){
      state.cfg = cfg;
      if (state._lastData && Object.keys(state._lastData).length) ingest(state._lastData, cfg);
      return;
    }
    state.bindKey = key;
    if (state.unsub) { try { state.unsub(); } catch (e) {} state.unsub = null; }
    if (state.unsubCols) { try { state.unsubCols(); } catch (e) {} state.unsubCols = null; }
    state.cfg = cfg;
    if (!client){ showWaiting(cfg, 'Sigma plugin SDK did not load.'); return; }
    // Same as the (working) body map: subscribe by the plain element id, and
    // also by the raw config value in case the host keys the feed by that.
    var raw = cfg.source;
    var sid = sourceId(raw);
    state.diag = { srcType: typeof raw, src: (function(){ try { return JSON.stringify(raw); } catch (e) { return String(raw); } })(), feeds: 0, keys: 0, cols: 0 };
    if (!sid){
      showWaiting(cfg, 'Bind source to tbl-pnl-live (P&L Live).');
      return;
    }
    if (!colKey(cfg.line) || !colKey(cfg.prior) || !colKey(cfg.current)){
      // Source present but columns not mapped yet — wait, do NOT show sample.
      showWaiting(cfg, 'Map Line · Prior · Current columns (or wait for auto-bind).');
    } else {
      showWaiting(cfg, 'Loading statement from workbook…');
    }
    try {
      // Tell Sigma we're loading (same as the body map) so it waits for our
      // data feed — including the headless export renderer. Safety release.
      try { client.config.setLoadingState(true); } catch (e) {}
      clearTimeout(state.loadTimer);
      state.loadTimer = setTimeout(function(){ try { client.config.setLoadingState(false); } catch (e) {} }, 30000);
      var ids = [sid];
      if (raw && raw !== sid) ids.push(raw);
      function onCols(cols){
        if (!cols || !Object.keys(cols).length) return;
        state.cols = cols;
        state.diag.cols = Object.keys(cols).length;
        if (state._lastData) ingest(state._lastData, cfg);
      }
      function onData(dd){
        var payload = unwrapData(dd) || {};
        state.diag.feeds++;
        // Two subscriptions to the SAME element: keep whichever feed has rows.
        if (!Object.keys(payload).length && state._lastData && Object.keys(state._lastData).length) return;
        state.diag.keys = Object.keys(payload).length;
        state._lastData = payload;
        ingest(payload, state.cfg);
        try { client.config.setLoadingState(false); } catch (e) {}
      }
      var unsubs = [];
      ids.forEach(function(x){
        try { unsubs.push(client.elements.subscribeToElementColumns(x, onCols)); } catch (e) {}
        try { unsubs.push(client.elements.subscribeToElementData(x, onData)); } catch (e) {}
      });
      state.unsub = function(){ unsubs.forEach(function(u){ try { u && u(); } catch (e) {} }); };
      state.unsubCols = null;
    } catch (e) {
      console.error('[pnl-stmt] bind failed', e);
      showWaiting(cfg, 'Plugin bind failed — see console.');
    }
  }

  if (client) {
    client.config.subscribe(bindSource);
    var initCfg = client.config.get();
    if (initCfg && initCfg.source) bindSource(initCfg);
  } else {
    bindSource({});
  }
})();
</script>
</body>
</html>
